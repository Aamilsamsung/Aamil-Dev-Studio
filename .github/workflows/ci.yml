name: Website checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run validate
      - run: npm run build
      # GitHub's Ubuntu runner includes Google Chrome and its OS dependencies.
      - run: npx playwright test

      - name: Verify live production layouts and accessibility
        run: npx playwright test
        env:
          BASE_URL: https://aamil-dev-studio.vercel.app
